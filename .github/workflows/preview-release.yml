name: Win64 Portable Preview Release

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - src/wlan_troubleshooter_ko/__init__.py
      - src/wlan_troubleshooter_ko/app.py
      - src/wlan_troubleshooter_ko/resources/**
      - tests/portable_build/**
      - RELEASE_NOTES.md
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/preview-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wlan-troubleshooter-ko-portable-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build, and publish Win64 Portable
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: src

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: x64

      - name: Run complete runtime-offline validation gate
        shell: pwsh
        run: ./scripts/verify_offline.ps1 -PythonPath python

      - name: Read and validate release metadata
        id: metadata
        shell: pwsh
        run: |
          $Project = Get-Content -LiteralPath "pyproject.toml" -Raw
          $Module = Get-Content -LiteralPath "src/wlan_troubleshooter_ko/__init__.py" -Raw
          $Supply = Get-Content -LiteralPath "tests/portable_build/supply-chain.json" -Raw | ConvertFrom-Json

          $ProjectVersion = [regex]::Match($Project, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $ModuleVersion = [regex]::Match($Module, '(?m)^__version__\s*=\s*"([^"]+)"').Groups[1].Value
          $Tag = [regex]::Match($Project, '(?m)^release-tag\s*=\s*"([^"]+)"').Groups[1].Value
          $Title = [regex]::Match($Project, '(?m)^release-title\s*=\s*"([^"]+)"').Groups[1].Value
          $PrereleaseText = [regex]::Match($Project, '(?m)^release-prerelease\s*=\s*(true|false)').Groups[1].Value

          if (-not $ProjectVersion -or -not $ModuleVersion -or -not $Tag -or -not $Title -or -not $PrereleaseText) {
              throw "Release metadata is incomplete."
          }
          if ($ProjectVersion -ne $ModuleVersion) {
              throw "Project and module versions do not match."
          }
          if ($Tag -ne "v0.3.0-alpha.1" -or $Supply.wireshark.msi.sha256 -eq "DISCOVER") {
              throw "Portable release supply-chain metadata is not pinned."
          }
          "tag=$Tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "title=$Title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$($PrereleaseText.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install exact build-only Python packages
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input --no-deps -r tests/portable_build/requirements-build.txt
          python -m pip check

      - name: Build and finalize Portable release assets
        id: package
        shell: pwsh
        run: |
          $Output = Join-Path $env:RUNNER_TEMP "portable-release-output"
          ./tests/portable_build/build_portable.ps1 -Mode Build -PythonPath python -OutputDirectory $Output
          ./tests/portable_build/finalize_portable.ps1 -PackageOutputPath (Join-Path $Output "package-output.json") -PythonPath python
          $Package = Get-Content -LiteralPath (Join-Path $Output "package-output.json") -Raw | ConvertFrom-Json
          foreach ($Name in @("archive", "archive_checksum", "wireshark_source", "wireshark_source_checksum", "observed_supply_chain")) {
              $Value = [string]$Package.$Name
              if (-not (Test-Path -LiteralPath $Value -PathType Leaf)) {
                  throw "Release asset is missing: $Name"
              }
              "$Name=$Value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          "archive_sha256=$($Package.archive_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive_size_bytes=$($Package.archive_size_bytes)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Get-Content -LiteralPath (Join-Path $Output "package-output.json")

      - name: Create or refresh GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = '${{ steps.metadata.outputs.tag }}'
          $Title = '${{ steps.metadata.outputs.title }}'
          $Assets = @(
              '${{ steps.package.outputs.archive }}',
              '${{ steps.package.outputs.archive_checksum }}',
              '${{ steps.package.outputs.wireshark_source }}',
              '${{ steps.package.outputs.wireshark_source_checksum }}',
              '${{ steps.package.outputs.observed_supply_chain }}'
          )

          & gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          $Exists = $LASTEXITCODE -eq 0
          if ($Exists) {
              & gh release edit $Tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $Title --notes-file RELEASE_NOTES.md
              if ($LASTEXITCODE -ne 0) { throw "Failed to update the existing release." }
              & gh release upload $Tag @Assets --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) { throw "Failed to refresh release assets." }
          }
          else {
              $Arguments = @(
                  "release", "create", $Tag,
                  "--repo", $env:GITHUB_REPOSITORY,
                  "--target", $env:GITHUB_SHA,
                  "--title", $Title,
                  "--notes-file", "RELEASE_NOTES.md"
              )
              if ('${{ steps.metadata.outputs.prerelease }}' -eq 'true') {
                  $Arguments += "--prerelease"
              }
              $Arguments += $Assets
              & gh @Arguments
              if ($LASTEXITCODE -ne 0) { throw "Failed to create the Portable prerelease." }
          }

      - name: Publish release build summary
        shell: pwsh
        run: |
          "### Win64 Portable release" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Tag: ${{ steps.metadata.outputs.tag }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- ZIP bytes: ${{ steps.package.outputs.archive_size_bytes }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          ("- ZIP SHA-256: " + '${{ steps.package.outputs.archive_sha256 }}') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
