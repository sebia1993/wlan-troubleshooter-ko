name: Preview Release

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - src/wlan_troubleshooter_ko/__init__.py
      - RELEASE_NOTES.md
      - .github/workflows/preview-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wlan-troubleshooter-ko-preview-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish source preview
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: src

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: x64

      - name: Run complete offline validation gate
        shell: pwsh
        run: ./scripts/verify_offline.ps1 -PythonPath python

      - name: Read and validate release metadata
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Project = Get-Content -LiteralPath "pyproject.toml" -Raw
          $Module = Get-Content -LiteralPath "src/wlan_troubleshooter_ko/__init__.py" -Raw

          $ProjectVersion = [regex]::Match($Project, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $ModuleVersion = [regex]::Match($Module, '(?m)^__version__\s*=\s*"([^"]+)"').Groups[1].Value
          $Tag = [regex]::Match($Project, '(?m)^release-tag\s*=\s*"([^"]+)"').Groups[1].Value
          $Title = [regex]::Match($Project, '(?m)^release-title\s*=\s*"([^"]+)"').Groups[1].Value
          $PrereleaseText = [regex]::Match($Project, '(?m)^release-prerelease\s*=\s*(true|false)').Groups[1].Value

          if (-not $ProjectVersion -or -not $ModuleVersion -or -not $Tag -or -not $Title -or -not $PrereleaseText) {
              throw "Release metadata is incomplete."
          }
          if ($ProjectVersion -ne $ModuleVersion) {
              throw "Project and module versions do not match."
          }
          if ($Tag -notmatch '^v[0-9]') {
              throw "Release tag format is invalid."
          }

          "version=$ProjectVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$Tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "title=$Title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$($PrereleaseText.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build source-only preview archive
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Tag = '${{ steps.metadata.outputs.tag }}'
          $SafeTag = $Tag -replace '[^A-Za-z0-9._-]', '-'
          $Stage = Join-Path $env:RUNNER_TEMP "wlan-troubleshooter-ko-$SafeTag"
          $Archive = Join-Path $env:RUNNER_TEMP "wlan-troubleshooter-ko-$SafeTag-source-preview.zip"
          $Checksum = "$Archive.sha256"

          Remove-Item -LiteralPath $Stage -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $Archive -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $Checksum -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $Stage | Out-Null

          Copy-Item -LiteralPath "src" -Destination $Stage -Recurse
          @(
              "README.md",
              "LICENSE",
              "THIRD_PARTY_NOTICES.md",
              "IMPLEMENTATION_STATUS.md",
              "CHANGELOG.md",
              "RELEASE_NOTES.md",
              "pyproject.toml"
          ) | ForEach-Object { Copy-Item -LiteralPath $_ -Destination $Stage }

          $Launcher = @'
          [CmdletBinding()]
          param([switch]$SelfCheck)
          $env:PYTHONPATH = Join-Path $PSScriptRoot "src"
          $Arguments = @("-3.13", "-m", "wlan_troubleshooter_ko")
          if ($SelfCheck) {
              $Arguments += "--self-check"
          }
          & py @Arguments
          exit $LASTEXITCODE
          '@
          Set-Content -LiteralPath (Join-Path $Stage "START_PREVIEW.ps1") -Value $Launcher -Encoding utf8

          Get-ChildItem -LiteralPath $Stage -Directory -Recurse -Filter "__pycache__" |
              Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath $Stage -File -Recurse -Include "*.pyc", "*.pyo" |
              Remove-Item -Force

          Compress-Archive -Path (Join-Path $Stage "*") -DestinationPath $Archive -CompressionLevel Optimal
          $Hash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $(Split-Path -Leaf $Archive)" | Set-Content -LiteralPath $Checksum -Encoding ascii

          "archive=$Archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum=$Checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or refresh GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $Tag = '${{ steps.metadata.outputs.tag }}'
          $Title = '${{ steps.metadata.outputs.title }}'
          $Archive = '${{ steps.package.outputs.archive }}'
          $Checksum = '${{ steps.package.outputs.checksum }}'
          $IsPrerelease = '${{ steps.metadata.outputs.prerelease }}' -eq 'true'

          & gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          $Exists = $LASTEXITCODE -eq 0

          if ($Exists) {
              & gh release edit $Tag --repo $env:GITHUB_REPOSITORY --title $Title --notes-file RELEASE_NOTES.md
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to update the existing release."
              }
              & gh release upload $Tag $Archive $Checksum --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to refresh release assets."
              }
          }
          else {
              $Arguments = @(
                  "release", "create", $Tag,
                  "--repo", $env:GITHUB_REPOSITORY,
                  "--target", $env:GITHUB_SHA,
                  "--title", $Title,
                  "--notes-file", "RELEASE_NOTES.md"
              )
              if ($IsPrerelease) {
                  $Arguments += "--prerelease"
              }
              $Arguments += @($Archive, $Checksum)
              & gh @Arguments
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to create the preview release."
              }
          }
