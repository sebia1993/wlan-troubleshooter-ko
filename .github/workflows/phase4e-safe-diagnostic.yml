name: Phase 4E Safe Portable Diagnostic

on:
  push:
    branches:
      - chatgpt/phase-4e-device-aliases
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: phase4e-safe-portable-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Build and report sanitized transaction failure
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      PYTHONHASHSEED: "0"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: x64

      - name: Run offline validation
        shell: pwsh
        run: ./scripts/verify_offline.ps1 -PythonPath python

      - name: Install exact build-only packages
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input --no-deps -r tests/portable_build/requirements-build.txt
          python -m pip check

      - name: Build finalized Portable package
        shell: pwsh
        run: |
          $Output = Join-Path $env:RUNNER_TEMP "phase4e-diagnostic-package"
          $Package = Join-Path $Output "package-output.json"
          ./tests/portable_build/build_portable.ps1 -Mode Build -PythonPath python -OutputDirectory $Output
          ./tests/portable_build/finalize_portable.ps1 -PackageOutputPath $Package -PythonPath python
          "PHASE4E_PACKAGE=$Package" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run transaction verification and comment only sanitized diagnostics
        shell: pwsh
        run: |
          $Log = Join-Path $env:RUNNER_TEMP "phase4e-safe-diagnostic.log"
          $Failed = $false
          try {
              & ./tests/portable_build/verify_transaction_sessions.ps1 -PackageOutputPath $env:PHASE4E_PACKAGE -PythonPath python *>&1 |
                  Tee-Object -FilePath $Log
          }
          catch {
              $Failed = $true
              $_.Exception.Message | Out-File -FilePath $Log -Encoding utf8 -Append
          }

          $SafeLines = @(
              Get-Content -LiteralPath $Log -ErrorAction SilentlyContinue |
                  Where-Object {
                      $_ -match '^(Ethernet|PPP-EAP) analysis (state|message):' -or
                      $_ -match '^Portable transaction-session analysis failed:' -or
                      $_ -match '^Portable EAP, RADIUS, DHCP, DNS, and TCP transaction-session integration tests passed\.$'
                  }
          )
          if ($SafeLines.Count -eq 0) {
              $SafeLines = @("정규화된 안전 진단 문장이 생성되지 않았습니다.")
          }
          $Body = @(
              "### Phase 4E 안전 진단",
              "",
              "합성 캡처 라벨과 프로그램의 정규화된 상태만 표시합니다.",
              "",
              '```text',
              ($SafeLines -join "`n"),
              '```',
              "",
              "commit: $env:GITHUB_SHA"
          ) -join "`n"
          $BodyFile = Join-Path $env:RUNNER_TEMP "phase4e-safe-comment.md"
          $Body | Set-Content -LiteralPath $BodyFile -Encoding utf8
          gh pr comment 9 --repo $env:GITHUB_REPOSITORY --body-file $BodyFile

          if ($Failed) {
              throw "Phase 4E transaction verification failed; sanitized diagnosis was posted to PR #9."
          }
