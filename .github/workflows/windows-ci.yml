name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wlan-troubleshooter-ko-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-0-4d-validation:
    name: Phase 0-4D offline validation
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: "0"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      PYTHONPATH: src

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: x64

      - name: Run offline validation
        shell: pwsh
        run: ./scripts/verify_offline.ps1 -PythonPath python
