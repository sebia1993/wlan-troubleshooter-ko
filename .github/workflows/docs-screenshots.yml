name: Documentation screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/docs-screenshots.yml'
      - 'tests/portable_build/render_usage_screenshots.py'
      - 'tests/portable_build/capture_windows.py'
      - 'tests/portable_build/prepare_docs_capture.ps1'
      - 'tests/portable_build/requirements-docs-capture.txt'

permissions:
  contents: read

concurrency:
  group: docs-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install documentation-only capture dependency
        run: >-
          python -m pip install --only-binary=:all: -r tests/portable_build/requirements-docs-capture.txt
      - name: Prepare hash-pinned public Portable runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tests/portable_build/prepare_docs_capture.ps1 -OutputDirectory "$env:RUNNER_TEMP/docs-capture-runtime"
      - name: Analyze synthetic packets in the real Tk application and capture its window
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python tests/portable_build/render_usage_screenshots.py --vendor-root "$env:RUNNER_TEMP/docs-capture-runtime/portable/vendor/wireshark" --output artifacts/usage-screenshots
      - name: Upload screenshots and provenance for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usage-screenshots
          path: artifacts/usage-screenshots/
          if-no-files-found: error
          retention-days: 14
